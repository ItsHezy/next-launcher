[package]
name = "egs-download"
description = "Download, patch, verify and repair engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
egs-manifest = { path = "../egs-manifest" }
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "fs", "io-util", "macros"] }
sha1 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros"] }
tempfile = "3"

[lints]
workspace = true
