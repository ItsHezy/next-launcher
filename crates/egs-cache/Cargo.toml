[package]
name = "egs-cache"
description = "SQLite cache: schema, migrations, library snapshot, settings, image index."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Derive specta::Type on IPC-facing rows so src-tauri can export TS bindings.
specta = ["dep:specta"]

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
