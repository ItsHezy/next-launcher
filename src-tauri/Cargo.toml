[package]
name = "next-launcher"
description = "Next Launcher: a fast, lightweight client for the Epic Games Store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "next-launcher"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
egs-cache = { path = "../crates/egs-cache", features = ["specta"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "smallvec", "std"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[lints]
workspace = true
