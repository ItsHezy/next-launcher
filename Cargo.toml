[workspace]
resolver = "2"
members = [
    "crates/egs-auth",
    "crates/egs-api",
    "crates/egs-manifest",
    "crates/egs-download",
    "crates/egs-launch",
    "crates/egs-cache",
    "crates/egs-import",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
# License pending: see docs/decisions/0001-license.md
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
rusqlite = { version = "0.41", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Debug builds: line tables for our code, no debug info for dependencies.
# Keeps target/debug small (it reached 8 GB with full debug info).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
