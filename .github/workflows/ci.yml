name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Svelte type check
        run: npm -w ui run check

      - name: ESLint
        run: npm -w ui run lint

      - name: Build UI
        run: npm -w ui run build

      - name: Bundle budget (80 KB initial / 250 KB total, gzipped)
        run: npm run budget

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (also regenerates TS bindings)
        run: cargo test --workspace

      - name: TS bindings are up to date
        shell: bash
        run: git diff --exit-code -- ui/src/lib/bindings.ts
